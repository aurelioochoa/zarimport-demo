<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#931B4A">
<title>Zarimport · La belleza a tu alcance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/brand/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <aside class="demo-bar">
    <span><b>Prototipo de demostración</b> · Úsalo completo: regístrate, gira la ruleta, compra y paga en modo de prueba.</span>
    <a href="admin.html" target="_blank">Panel de la dueña ↗</a>
    <button onclick="Store.reset();location.hash='';location.reload()">Reiniciar demo</button>
  </aside>

  <div class="phone" id="phone">
    <header class="topbar" id="topbar">
      <div class="topbar-in">
        <a class="brand" href="#/">
          <span class="mark">Z</span>
          <span class="name">ZARIMPORT<small>la belleza a tu alcance</small></span>
        </a>
        <nav class="desk-nav" aria-label="Principal">
          <a href="#/" data-tab="home">Inicio</a>
          <a href="#/categorias" data-tab="cats">Catálogo</a>
          <a href="#/ofertas" data-tab="deals">Ofertas</a>
          <a href="#/revendedoras">Revendedoras</a>
        </nav>
        <form class="search desk-search" role="search" onsubmit="location.hash='#/buscar/'+encodeURIComponent(this.q.value);return false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input name="q" placeholder="Busca labiales, brochas, cosmetiqueras…" autocomplete="off" aria-label="Buscar productos">
        </form>
        <a class="icon-btn zari-btn" href="#/ayuda" aria-label="Ayuda con Zari" title="Ayuda con Zari">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2.5-5 2.5"/></svg>
        </a>
        <a class="icon-btn" href="#/notificaciones" aria-label="Notificaciones" title="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="badge" id="b-notif"></span>
        </a>
        <a class="icon-btn desk-only" href="#/carrito" data-tab="cart" aria-label="Carrito" title="Carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="badge b-cart"></span>
        </a>
        <a class="icon-btn desk-only" href="#/perfil" data-tab="me" aria-label="Mi cuenta" title="Mi cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </a>
      </div>
    </header>

    <main class="view" id="view"></main>

    <nav class="tabbar" id="tabbar">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
      <a href="#/categorias" data-tab="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Catálogo</a>
      <a href="#/ofertas" data-tab="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Ofertas</a>
      <a href="#/carrito" data-tab="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Carrito<span class="badge b-cart" id="b-cart"></span></a>
      <a href="#/perfil" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Mi cuenta</a>
    </nav>

    <div class="layer" id="layer"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/engage.js"></script>
<script src="js/zari.js"></script>
</body>
</html>
